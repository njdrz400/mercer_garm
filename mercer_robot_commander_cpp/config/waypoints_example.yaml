# Waypoints: name -> x,y,z (meters). Path: one line per step (wp, led, em_on, pause_sec).

led_color: g   # default for Start and Return to start (g, y, r)

waypoints:
  Home:   { x: 0.22,  y: 0.0,   z: 0.29 }
  Pick:   { x: 0.3,   y: 0.0,   z: 0.020 }
  mid:    { x: 0.2,   y: 0.0,   z: 0.1 }
  X00:    { x: 0.1, y: 0.175, z: 0.020 }
  X01:    { x: 0.15, y: 0.175, z: 0.010 }
  X02:    { x: 0.125, y: 0.175, z: 0.010 }
  X10:    { x: 0.025, y: 0.225, z: 0.010 }
  X11:    { x: 0.075, y: 0.225, z: 0.010 }
  X12:    { x: 0.125, y: 0.225, z: 0.010 }
  Finish: { x: 0.3,   y: 0.0,   z: 0.020 }

# Path: one line per wp (wp, led, em_on, optional pause_sec)
path:
  - { wp: Home,   led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: X00,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: X01,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: X02,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: X10,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: X11,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Pick,   led: g,  em_on: false, pause_sec: 1.5 }
  - { wp: X12,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: mid,    led: y,  em_on: false, pause_sec: 1.5 }
  - { wp: Finish, led: g,  em_on: false, pause_sec: 1.5 }
