controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    # Broadcaster (no joints list needed)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 3-DOF arm on position command
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints: [joint1, joint2, joint3]
      command_interfaces: [position]
      state_interfaces: [position, velocity]

    # Pick exactly ONE of the following for the tool:

    # (A) Simple gripper controller for single DOF (recommended)
    # tool_controller:
    #   type: gripper_controllers/GripperActionController
    #   joint: jointPWM
    #   command_interfaces: [position]
    #   state_interfaces: [position, velocity]

    # (B) Trajectory controller on the tool joint (if you really want JTC)
    tool_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints: [jointPWM]                  # <-- REQUIRED
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      allow_nonzero_velocity_at_trajectory_end: false

