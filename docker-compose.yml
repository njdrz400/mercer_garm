# Run with GUI (rqt, rviz2): pass display and X11 socket
# Usage: docker compose run --rm mercer_garm
#         docker compose run --rm mercer_garm rviz2
#
# Build from repo root: docker compose build

services:
  mercer_garm:
    build:
      context: .
      dockerfile: Dockerfile
    image: mercer_garm:jazzy
    container_name: mercer_garm
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    stdin_open: true
    tty: true
