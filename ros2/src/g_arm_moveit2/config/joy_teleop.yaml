joy_teleop:
  ros__parameters:
    teleop_joint_states:
      type: topic
      topic_name: /joint_commands
      message_type: sensor_msgs/msg/JointState

      axis_mappings:
        - axis: 1                # left stick vertical
          target: position[0]
          scale: 0.5
        - axis: 2                # left stick horizontal
          target: position[1]
          scale: 0.25
        - axis: 4                # right stick vertical
          target: position[2]
          scale: 1.0

      static_mappings:
        - target: name
          value: "['joint1', 'joint2', 'joint3']"
        - target: velocity
          value: [0.0, 0.0, 0.0]
        - target: effort
          value: [0.0, 0.0, 0.0]
