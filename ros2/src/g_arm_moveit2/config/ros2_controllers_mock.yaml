# ros2_control config for mock hardware (includes joint_state_broadcaster for /joint_states + TF)
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    tool_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
     publish_rate: 50

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

tool_controller:
  ros__parameters:
    joints:
      - jointPWM
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
