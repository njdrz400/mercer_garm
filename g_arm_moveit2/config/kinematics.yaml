# Inverse kinematics solver. Two options:
#
# 1) TRAC-IK (recommended if KDL often fails): install with
#      sudo apt install ros-jazzy-trac-ik-kinematics-plugin
#    Then use kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
#    and remove kinematics_solver_attempts / kinematics_solver_search_resolution.
#
# 2) KDL (default): use kdl_kinematics_plugin/KDLKinematicsPlugin with the
#    resolution, timeout, and attempts below. See TRAC_IK_SETUP.md to switch.
#
arm:
  #Option A: TRAC-IK (uncomment after installing ros-jazzy-trac-ik-kinematics-plugin)
  #kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  #kinematics_solver_timeout: 60.0
  #position_only_ik: True
  # solve_type: Speed # or Distance, Manipulation1, Manipulation2, Manipulation3


  # Option B: KDL (current)
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.001
  kinematics_solver_timeout: 10.0
  kinematics_solver_attempts: 150000
  position_only_ik: True
